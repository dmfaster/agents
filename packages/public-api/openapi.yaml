          additionalProperties: false
          required: [sent, reachedCompanies, replies, bookedCalls]
          properties:
            sent: { type: string, enum: [complete, partial, unavailable] }
            reachedCompanies: { type: string, enum: [complete, partial, unavailable] }
            replies: { type: string, enum: [complete, partial, unavailable] }
            bookedCalls: { type: string, enum: [complete, partial, unavailable] }
        sources:
          type: object
          additionalProperties: false
          required: [sent, reachedCompanies, replies, bookedCalls]
          properties:
            sent: { type: string, minLength: 1 }
            reachedCompanies: { type: string, minLength: 1 }
            replies: { type: string, minLength: 1 }
            bookedCalls: { type: string, minLength: 1 }
