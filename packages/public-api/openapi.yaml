          type: array
          uniqueItems: true
          items: { $ref: "#/components/schemas/TargetChannel" }
        dailyCap: { type: integer, minimum: 0 }

    AgentActionAuthorization:
      type: object
      additionalProperties: false
      required:
        [
          id,
          action,
          campaignId,
          commandId,
          confirmationCode,
          status,
          expiresAt,
          approvedAt,
          deniedAt,
          consumedAt,
          snapshot,
        ]
      properties:
        id: { type: string, pattern: "^agent_action_[a-f0-9]{32}$" }
        action: { $ref: "#/components/schemas/AgentCampaignAction" }
        campaignId: { type: string }
        commandId: { type: string }
        confirmationCode: { type: string, pattern: "^[A-HJ-NP-Z2-9]{4}-[A-HJ-NP-Z2-9]{4}$" }
        status: { type: string, enum: [pending, approved, denied, consumed, expired] }
        expiresAt: { type: string, format: date-time }
        approvedAt: { type: string }
        deniedAt: { type: string }
        consumedAt: { type: string }
        snapshot: { $ref: "#/components/schemas/AgentActionSnapshot" }
        approvalMethod:
          type: string
          enum: [in_app_approval, connection_permission]

    CampaignActionReadyOutput:
