      x-dmfaster-approval: none
      x-dmfaster-owner-only: false
      x-dmfaster-mcp:
        name: industry_lookup
        title: Resolve industry
        description: Resolve a natural-language industry or explicit TOL code into official executable TOL selections. Returns clarification instead of guessing.
        annotations:
          readOnlyHint: true
          destructiveHint: false
          idempotentHint: true
          openWorldHint: false
      x-dmfaster-cli:
        section: Campaign planning and drafts
        usage: industry lookup QUERY [--version 2008|2025] [--language en|fi]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IndustryLookupInput" }
      responses:
        "200":
