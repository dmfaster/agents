            instagramSendingWindowEndMinute:
              type: integer
              minimum: 60
              maximum: 1440
            instagramSendingWindowWeekdays:
              type: integer
              minimum: 1
              maximum: 127
            timezone:
              type: string
          required:
            - targetListId
            - messageVariants
            - pacingSeconds
            - onlyNewChats
            - skipPreviouslyMessaged
            - enabled
            - instagramSendingWindowEnabled
            - instagramSendingWindowStartMinute
            - instagramSendingWindowEndMinute
            - instagramSendingWindowWeekdays
            - timezone
    SendingIssue:
      type: object
      additionalProperties: false
      required: [code, severity, message]
      properties:
        code:
          type: string
        severity:
          type: string
          enum: [info, warning, blocker]
        message:
          type: string

    SendingInspectOutput:
      type: object
      additionalProperties: false
      required:
        - generatedAt
        - campaignId
        - campaignName
        - status
        - summary
        - issues
        - sending
      properties:
        generatedAt:
          type: string
          format: date-time
        campaignId: { type: string }
        campaignName: { type: string }
        campaignStatus:
          oneOf:
            - $ref: "#/components/schemas/CampaignStatus"
            - type: "null"
        status:
          type: string
          enum: [healthy, waiting, attention, blocked, idle]
        summary: { type: string }
        issues:
          type: array
          items:
            $ref: "#/components/schemas/SendingIssue"
        sending:
          description: Workspace-wide counters; do not attribute these to campaignId.
