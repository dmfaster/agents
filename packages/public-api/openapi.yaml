      x-dmfaster-required-scopes: ["pipeline:read"]
      x-dmfaster-approval: none
      x-dmfaster-owner-only: false
      x-dmfaster-mcp:
        name: pipeline_inspect
        title: Inspect pipeline
        description: Read contacted, replied, booked-call, and closed pipeline counts for a campaign.
        annotations:
          readOnlyHint: true
          destructiveHint: false
          idempotentHint: true
          openWorldHint: false
      x-dmfaster-cli:
        section: Workspace reads
        usage: pipeline inspect [CAMPAIGN_ID]
      requestBody:
