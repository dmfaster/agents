    CompanyInspectInput:
      type: object
      additionalProperties: false
      properties:
        country:
          $ref: "#/components/schemas/SupportedCountry"
        businessId:
          type: string
          maxLength: 192
          minLength: 1
      required:
        - country
        - businessId
    CompanyInspectData:
      type: object
