components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: DM Faster agent token
      description: A revocable, scoped token bound to one DM Faster workspace.

  headers:
    CacheControl:
      description: Agent tool responses are not cached.
      schema:
        type: string
        const: no-store
    RequestId:
      description: Stable identifier for support, audit, and log correlation.
      schema:
        type: string
        minLength: 1
        maxLength: 128

  responses:
    AuthBadRequest:
      description: The authorization request or grant is invalid, expired, or already consumed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AgentAuthErrorResponse" }
    AuthUnauthorized:
      description: The bearer credential is missing, malformed, expired, or revoked.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AgentAuthErrorResponse" }
    AuthForbidden:
      description: Browser approval was denied or workspace access is no longer available.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AgentAuthErrorResponse" }
    AuthConflict:
      description: The account cannot create another active agent credential.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AgentAuthErrorResponse" }
    AuthPending:
      description: Browser authorization is still pending.
      headers:
        Retry-After:
          description: Minimum seconds before polling again.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AgentAuthErrorResponse" }
    AuthTooManyRequests:
      description: The authorization client is polling too quickly or exceeded an authentication limit.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AgentAuthErrorResponse" }
    AuthServiceUnavailable:
      description: Agent authentication is temporarily unavailable.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AgentAuthErrorResponse" }
    BadRequest:
      description: The request body is invalid or exceeds a documented bound.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            error:
              code: invalid_request
              message: The agent tool input is invalid.
              retryable: false
              requestId: req_01JEXAMPLE
    Unauthorized:
      description: The bearer token is missing, malformed, expired, or revoked.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            error:
              code: unauthorized
              message: A valid DM Faster agent token is required.
              retryable: false
              requestId: req_01JEXAMPLE
    Forbidden:
      description: The token is valid but lacks a required scope or workspace access.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            error:
              code: insufficient_scope
              message: The token does not grant the required scope.
              retryable: false
              requestId: req_01JEXAMPLE
    NotFound:
      description: The workspace-scoped campaign or company resource was not found.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            error:
              code: not_found
              message: The requested resource was not found in this workspace.
              retryable: false
              requestId: req_01JEXAMPLE
    TooManyRequests:
      description: The workspace or token rate limit was exceeded.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            error:
              code: rate_limited
              message: Too many agent tool requests.
              retryable: true
              requestId: req_01JEXAMPLE
    InternalServerError:
      description: The request failed unexpectedly.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            error:
              code: internal_error
              message: The agent tool could not complete the request.
              retryable: true
              requestId: req_01JEXAMPLE
    ServiceUnavailable:
      description: An authoritative upstream service is temporarily unavailable.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
        Retry-After:
          description: Seconds to wait before retrying, when known.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            error:
              code: service_unavailable
              message: Authoritative workspace data is temporarily unavailable.
              retryable: true
              requestId: req_01JEXAMPLE

  schemas:
    AgentApiScope:
      type: string
      enum:
        - workspace:read
        - campaigns:read
        - sending:read
        - inbox:read
        - pipeline:read
        - audiences:read
        - campaigns:write
        - campaigns:launch
        - campaigns:control
        - inbox:write
        - pipeline:write
        - calendar:read
        - calendar:write
        - calls:read
        - leads:read
        - leads:write

    AgentDeviceAuthorizationInput:
      type: object
      additionalProperties: false
      required:
        - client
        - deviceName
        - codeChallenge
        - codeChallengeMethod
        - scopes
        - expiresInDays
      properties:
        client:
          type: string
          minLength: 1
          maxLength: 80
          pattern: '.*\S.*'
        deviceName:
          type: string
          minLength: 1
          maxLength: 100
          pattern: '.*\S.*'
        codeChallenge:
          type: string
          pattern: "^[A-Za-z0-9_-]{43}$"
          description: Base64url-encoded SHA-256 hash of the local PKCE verifier.
        codeChallengeMethod:
          type: string
          const: S256
        scopes:
          type: array
          minItems: 1
          maxItems: 14
          uniqueItems: true
          items:
            $ref: "#/components/schemas/AgentApiScope"
        expiresInDays:
          type: integer
          enum: [30, 90, 365]

    AgentDeviceAuthorizationResult:
      type: object
      additionalProperties: false
      required:
        - requestId
        - deviceCode
        - confirmationCode
        - verificationUrl
        - expiresIn
        - interval
      properties:
        requestId:
          type: string
          pattern: "^agent_auth_[a-f0-9]{32}$"
        deviceCode:
          type: string
          pattern: "^dmf_device_[A-Za-z0-9_-]{43}$"
        confirmationCode:
          type: string
          pattern: "^[A-HJ-NP-Z2-9]{4}-[A-HJ-NP-Z2-9]{4}$"
        verificationUrl:
          type: string
          format: uri
          description: Secret-free same-origin URL to open in the user's browser.
        expiresIn:
          type: integer
          const: 300
        interval:
          type: integer
          minimum: 1

    AgentDeviceTokenInput:
      type: object
      additionalProperties: false
      required: [deviceCode, codeVerifier]
      properties:
        deviceCode:
          type: string
          pattern: "^dmf_device_[A-Za-z0-9_-]{43}$"
          writeOnly: true
        codeVerifier:
          type: string
          minLength: 43
          maxLength: 128
          pattern: "^[A-Za-z0-9._~-]+$"
          writeOnly: true

    AgentCredential:
      type: object
      additionalProperties: false
      required: [id, name, client, scopes, workspaceUserId, expiresAt]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 200
        name:
          type: string
          minLength: 1
          maxLength: 200
        client:
          type: string
          minLength: 1
          maxLength: 200
        scopes:
          type: array
          minItems: 1
          maxItems: 14
          uniqueItems: true
          items:
            $ref: "#/components/schemas/AgentApiScope"
        workspaceUserId:
          type: string
          minLength: 1
          maxLength: 200
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time

    AgentAuthenticatedParty:
      type: object
      additionalProperties: false
      required: [id, name, email]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 200
        name:
          type: string
          minLength: 1
          maxLength: 300
        email:
          type: string
          format: email
          maxLength: 320

    AgentDeviceTokenResult:
      type: object
      additionalProperties: false
      required:
        - accessToken
        - tokenType
        - expiresIn
        - expiresAt
        - scope
        - credential
        - workspace
        - user
      properties:
        accessToken:
          type: string
          pattern: "^dmf_pat_[a-f0-9]{64}$"
        tokenType:
          type: string
          const: Bearer
        expiresIn:
          type: integer
          minimum: 0
        expiresAt:
          type: string
          format: date-time
        scope:
          type: string
          minLength: 1
        credential:
          $ref: "#/components/schemas/AgentCredential"
        workspace:
          $ref: "#/components/schemas/AgentAuthenticatedParty"
        user:
          $ref: "#/components/schemas/AgentAuthenticatedParty"

    AgentAuthenticationStatus:
      type: object
      additionalProperties: false
      required: [authenticated, credential, workspace, user]
      properties:
        authenticated:
          type: boolean
          const: true
        credential:
          $ref: "#/components/schemas/AgentCredential"
        workspace:
          $ref: "#/components/schemas/AgentAuthenticatedParty"
        user:
          $ref: "#/components/schemas/AgentAuthenticatedParty"

    AgentAuthenticationRevoked:
      type: object
      additionalProperties: false
      required: [revoked]
      properties:
        revoked:
          type: boolean
          const: true

    AgentAuthErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              minLength: 1
              maxLength: 100
            message:
              type: string
              minLength: 1
              maxLength: 500

    WebsiteEvidenceCriterion:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 60
        statement:
          type: string
          minLength: 1
          maxLength: 800
        requirement:
          type: string
          enum:
            - advertised
            - any_support
        retrievalTerms:
          description: Source-language keywords and synonyms supplied by the calling assistant; include Finnish terms for FI.
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 100
          minItems: 1
          maxItems: 12
        retrievalGroups:
          description: Optional required concept groups for precise retrieval. Synonyms are ORed within each group; all groups must occur in one original heading/passage context. For relationships split across passages, omit groups and broaden retrievalTerms explicitly. JEV still verifies the complete criterion.
          type: array
          minItems: 2
          maxItems: 4
          items:
            type: array
            minItems: 1
            maxItems: 12
            items:
              type: string
              minLength: 1
              maxLength: 100
      required:
        - id
        - statement
        - requirement
        - retrievalTerms
    CompanyEvidenceStartInput:
      type: object
      additionalProperties: false
      properties:
        country: { type: string, enum: [FI] }
        query: { type: string, minLength: 1, maxLength: 1500 }
        criteria:
          type: array
          minItems: 1
          maxItems: 4
          items: { $ref: "#/components/schemas/WebsiteEvidenceCriterion" }
        filters: { $ref: "#/components/schemas/CompanySearchFilters" }
        maxAgeDays: { type: integer, minimum: 1, maximum: 90 }
        idempotencyKey: { type: string, minLength: 1, maxLength: 100 }
      required: [country, query, criteria, idempotencyKey]
    CompanyEvidenceAdvanceInput:
      type: object
      additionalProperties: false
      properties:
        runId: { type: string, minLength: 36, maxLength: 36 }
        expectedRevision: { type: string, minLength: 64, maxLength: 64 }
        batchSize: { type: integer, minimum: 1, maximum: 16 }
      required: [runId, expectedRevision]
    CompanyEvidenceStatusInput:
      type: object
      additionalProperties: false
      properties:
        runId: { type: string, minLength: 36, maxLength: 36 }
        expectedRevision: { type: string, minLength: 64, maxLength: 64 }
      required: [runId, expectedRevision]
    CompanyEvidenceResultsInput:
      type: object
      additionalProperties: false
      properties:
        runId: { type: string, minLength: 36, maxLength: 36 }
        expectedRevision: { type: string, minLength: 64, maxLength: 64 }
        cursor: { type: string, minLength: 1, maxLength: 200 }
        pageSize: { type: integer, minimum: 1, maximum: 20 }
        view: { type: string, enum: [matches, unresolved, all] }
      required: [runId, expectedRevision]
    CompanyEvidenceCancelInput:
      type: object
      additionalProperties: false
      properties:
        runId: { type: string, minLength: 36, maxLength: 36 }
        expectedRevision: { type: string, minLength: 64, maxLength: 64 }
      required: [runId, expectedRevision]
    CompanyEvidenceRunData:
      type: object
      additionalProperties: false
      properties:
        runId: { type: string }
        expectedRevision: { type: string }
        querySignature: { type: string }
        status: { type: string, enum: [initializing, running, complete, cancelled, stale] }
        scanComplete: { type: boolean }
        country: { type: string, const: FI }
        query: { type: string }
        appliedCriteria:
          type: array
          minItems: 1
          maxItems: 4
          items: { $ref: "#/components/schemas/WebsiteEvidenceCriterion" }
        appliedFilters:
          anyOf:
            - $ref: "#/components/schemas/CompanySearchFilters"
            - type: "null"
        expiresAt: { type: string, format: date-time }
        companies:
          type: array
          minItems: 0
          maxItems: 20
          items: { $ref: "#/components/schemas/WebsiteEvidenceCompany" }
        view: { type: string, enum: [matches, unresolved, all] }
        nextCursor: { type: string }
        hasNextPage: { type: boolean }
        awaitingMoreResults: { type: boolean }
        total: { type: "null" }
        totalExact: { type: boolean, const: false }
        totalStatus: { type: string, const: unavailable }
        progress:
          type: object
          additionalProperties: false
          properties:
            eligibleCompanies: { type: integer, minimum: 0 }
            enqueuedCompanies: { type: integer, minimum: 0 }
            processedCompanies: { type: integer, minimum: 0 }
            pendingCompanies: { type: integer, minimum: 0 }
            processingCompanies: { type: integer, minimum: 0 }
            confirmedMatches: { type: integer, minimum: 0 }
            contradictedCompanies: { type: integer, minimum: 0 }
            unresolvedCompanies: { type: integer, minimum: 0 }
            missingEvidenceCompanies: { type: integer, minimum: 0 }
            staleEvidenceCompanies: { type: integer, minimum: 0 }
            retryingCompanies: { type: integer, minimum: 0 }
            checkedPassages: { type: integer, minimum: 0 }
          required:
            [
              eligibleCompanies,
              enqueuedCompanies,
              processedCompanies,
              pendingCompanies,
              processingCompanies,
              confirmedMatches,
              contradictedCompanies,
              unresolvedCompanies,
              missingEvidenceCompanies,
              staleEvidenceCompanies,
              retryingCompanies,
              checkedPassages,
            ]
        retryFailures:
          type: array
          maxItems: 20
          items:
            type: object
            additionalProperties: false
            properties:
              code: { type: string }
              companies: { type: integer, minimum: 1 }
              retryAt: { type: string, format: date-time }
