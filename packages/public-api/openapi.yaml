components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: DM Faster agent token
      description: A revocable, scoped token bound to one DM Faster workspace.

  headers:
    CacheControl:
      description: Agent tool responses are not cached.
      schema:
        type: string
        const: no-store
    RequestId:
      description: Stable identifier for support, audit, and log correlation.
      schema:
        type: string
        minLength: 1
        maxLength: 128

  responses:
    AuthBadRequest:
      description: The authorization request or grant is invalid, expired, or already consumed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AgentAuthErrorResponse" }
    AuthUnauthorized:
      description: The bearer credential is missing, malformed, expired, or revoked.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AgentAuthErrorResponse" }
    AuthForbidden:
      description: Browser approval was denied or workspace access is no longer available.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AgentAuthErrorResponse" }
    AuthConflict:
      description: The account cannot create another active agent credential.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AgentAuthErrorResponse" }
    AuthPending:
      description: Browser authorization is still pending.
      headers:
        Retry-After:
          description: Minimum seconds before polling again.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AgentAuthErrorResponse" }
    AuthTooManyRequests:
      description: The authorization client is polling too quickly or exceeded an authentication limit.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AgentAuthErrorResponse" }
    AuthServiceUnavailable:
      description: Agent authentication is temporarily unavailable.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AgentAuthErrorResponse" }
    BadRequest:
      description: The request body is invalid or exceeds a documented bound.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            error:
              code: invalid_request
              message: The agent tool input is invalid.
              retryable: false
              requestId: req_01JEXAMPLE
    Unauthorized:
      description: The bearer token is missing, malformed, expired, or revoked.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            error:
              code: unauthorized
              message: A valid DM Faster agent token is required.
              retryable: false
              requestId: req_01JEXAMPLE
    Forbidden:
      description: The token is valid but lacks a required scope or workspace access.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            error:
              code: insufficient_scope
              message: The token does not grant the required scope.
              retryable: false
              requestId: req_01JEXAMPLE
    NotFound:
      description: The workspace-scoped campaign or company resource was not found.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            error:
              code: not_found
              message: The requested resource was not found in this workspace.
              retryable: false
              requestId: req_01JEXAMPLE
    TooManyRequests:
      description: The workspace or token rate limit was exceeded.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            error:
              code: rate_limited
              message: Too many agent tool requests.
              retryable: true
              requestId: req_01JEXAMPLE
    InternalServerError:
      description: The request failed unexpectedly.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            error:
              code: internal_error
              message: The agent tool could not complete the request.
              retryable: true
              requestId: req_01JEXAMPLE
    ServiceUnavailable:
      description: An authoritative upstream service is temporarily unavailable.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
        Retry-After:
          description: Seconds to wait before retrying, when known.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            error:
              code: service_unavailable
              message: Authoritative workspace data is temporarily unavailable.
              retryable: true
              requestId: req_01JEXAMPLE

  schemas:
    AgentApiScope:
      type: string
      enum:
        - workspace:read
        - campaigns:read
        - sending:read
        - inbox:read
        - pipeline:read
        - audiences:read
        - campaigns:write
        - campaigns:launch
        - campaigns:control

    AgentDeviceAuthorizationInput:
      type: object
      additionalProperties: false
      required:
        - client
        - deviceName
        - codeChallenge
        - codeChallengeMethod
        - scopes
        - expiresInDays
      properties:
        client:
          type: string
          minLength: 1
          maxLength: 80
          pattern: '.*\S.*'
        deviceName:
          type: string
          minLength: 1
          maxLength: 100
          pattern: '.*\S.*'
        codeChallenge:
          type: string
          pattern: "^[A-Za-z0-9_-]{43}$"
          description: Base64url-encoded SHA-256 hash of the local PKCE verifier.
        codeChallengeMethod:
          type: string
          const: S256
        scopes:
          type: array
          minItems: 1
          maxItems: 9
          uniqueItems: true
          items:
            $ref: "#/components/schemas/AgentApiScope"
        expiresInDays:
          type: integer
          enum: [30, 90, 365]

    AgentDeviceAuthorizationResult:
      type: object
      additionalProperties: false
      required:
        - requestId
        - deviceCode
        - confirmationCode
        - verificationUrl
        - expiresIn
        - interval
      properties:
        requestId:
          type: string
          pattern: "^agent_auth_[a-f0-9]{32}$"
        deviceCode:
          type: string
          pattern: "^dmf_device_[A-Za-z0-9_-]{43}$"
        confirmationCode:
          type: string
          pattern: "^[A-HJ-NP-Z2-9]{4}-[A-HJ-NP-Z2-9]{4}$"
        verificationUrl:
          type: string
          format: uri
          description: Secret-free same-origin URL to open in the user's browser.
        expiresIn:
          type: integer
          const: 300
        interval:
          type: integer
          minimum: 1

    AgentDeviceTokenInput:
      type: object
      additionalProperties: false
      required: [deviceCode, codeVerifier]
      properties:
        deviceCode:
          type: string
          pattern: "^dmf_device_[A-Za-z0-9_-]{43}$"
          writeOnly: true
        codeVerifier:
          type: string
          minLength: 43
          maxLength: 128
          pattern: "^[A-Za-z0-9._~-]+$"
          writeOnly: true

    AgentCredential:
      type: object
      additionalProperties: false
      required: [id, name, client, scopes, workspaceUserId, expiresAt]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 200
        name:
          type: string
          minLength: 1
          maxLength: 200
        client:
          type: string
          minLength: 1
          maxLength: 200
        scopes:
          type: array
          minItems: 1
          maxItems: 9
          uniqueItems: true
          items:
            $ref: "#/components/schemas/AgentApiScope"
        workspaceUserId:
          type: string
          minLength: 1
          maxLength: 200
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time

    AgentAuthenticatedParty:
      type: object
      additionalProperties: false
      required: [id, name, email]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 200
        name:
          type: string
          minLength: 1
          maxLength: 300
        email:
          type: string
          format: email
          maxLength: 320

    AgentDeviceTokenResult:
      type: object
      additionalProperties: false
      required:
        - accessToken
        - tokenType
        - expiresIn
        - expiresAt
        - scope
        - credential
        - workspace
        - user
      properties:
        accessToken:
          type: string
          pattern: "^dmf_pat_[a-f0-9]{64}$"
        tokenType:
          type: string
          const: Bearer
        expiresIn:
          type: integer
          minimum: 0
        expiresAt:
          type: string
          format: date-time
        scope:
          type: string
          minLength: 1
        credential:
          $ref: "#/components/schemas/AgentCredential"
        workspace:
          $ref: "#/components/schemas/AgentAuthenticatedParty"
        user:
          $ref: "#/components/schemas/AgentAuthenticatedParty"

    AgentAuthenticationStatus:
      type: object
      additionalProperties: false
      required: [authenticated, credential, workspace, user]
      properties:
        authenticated:
          type: boolean
          const: true
        credential:
          $ref: "#/components/schemas/AgentCredential"
        workspace:
          $ref: "#/components/schemas/AgentAuthenticatedParty"
        user:
          $ref: "#/components/schemas/AgentAuthenticatedParty"

    AgentAuthenticationRevoked:
      type: object
      additionalProperties: false
      required: [revoked]
      properties:
        revoked:
          type: boolean
          const: true

    AgentAuthErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              minLength: 1
              maxLength: 100
            message:
              type: string
              minLength: 1
              maxLength: 500

    AgentToolName:
      type: string
      enum:
        - analytics.summary
        - workspace.briefing
        - campaigns.list
        - campaign.inspect
        - sending.inspect
        - replies.list
        - pipeline.inspect
        - company.timeline
        - industry.lookup
        - campaign.validate
        - audience.preview
        - lists.list
        - list.inspect
        - list.target.remove
        - campaign.draft.prepare
        - campaign.draft.update
        - list.import
        - list.prepare
        - campaign.prepare
        - campaign.launch.preflight
        - campaign.launch
        - campaign.pause.preflight
        - campaign.pause
        - companies.filters
        - companies.search
        - company.inspect
        - companies.list.prepare
        - companies.list.inspect
        - campaign.operation.inspect
        - campaign.delivery.inspect
        - campaign.delivery.update

    AgentToolPolicy:
      type: object
      additionalProperties: false
      required: [effect, approval, exposure]
      properties:
        effect:
          type: string
          enum: [read, draft, write, external]
        approval:
          type: string
          enum: [none, human_confirmation]
        exposure:
          type: string
          const: public_api

    AgentToolEvidence:
      type: object
      additionalProperties: false
      required: [source, observedAt, scope]
      properties:
        source:
          type: string
          enum:
            - workspace_campaigns
            - worker_control_plane
            - campaign_diagnostics
            - pipeline
            - inbox
            - company_database
            - classification_catalog
            - campaign_workflow
            - analytics_snapshot
        observedAt:
          type: string
          format: date-time
        scope:
          type: string
          enum: [workspace, campaign, audience, conversation]

    AgentToolConsistency:
      type: object
      additionalProperties: false
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [verified, unavailable, conflict]
        checks:
          type: array
          items:
            type: string

    AgentToolError:
      type: object
      additionalProperties: false
      required: [code, message, retryable]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 100
        message:
          type: string
          minLength: 1
          maxLength: 500
        retryable:
          type: boolean

    AgentToolResultBase:
      type: object
      additionalProperties: false
      required:
        - version
        - tool
        - policy
        - ok
        - generatedAt
        - durationMs
        - evidence
        - consistency
        - data
        - artifacts
        - error
      properties:
        version:
          type: integer
          const: 1
        tool:
          $ref: "#/components/schemas/AgentToolName"
        policy:
          $ref: "#/components/schemas/AgentToolPolicy"
        ok:
          type: boolean
        generatedAt:
          type: string
          format: date-time
        durationMs:
          type: integer
          minimum: 0
          maximum: 120000
        evidence:
          type: array
          items:
            $ref: "#/components/schemas/AgentToolEvidence"
        consistency:
          $ref: "#/components/schemas/AgentToolConsistency"
        data: {}
        artifacts:
          type: array
          items: {}
        error:
          oneOf:
            - $ref: "#/components/schemas/AgentToolError"
            - type: "null"

    AnalyticsSummaryResult:
      allOf:
        - $ref: "#/components/schemas/AgentToolResultBase"
        - type: object
          properties:
            tool: { type: string, const: analytics.summary }
            data:
              oneOf:
                - $ref: "#/components/schemas/AnalyticsSummaryOutput"
                - type: "null"

    WorkspaceBriefingResult:
      allOf:
        - $ref: "#/components/schemas/AgentToolResultBase"
        - type: object
          properties:
            tool: { type: string, const: workspace.briefing }
            data:
              oneOf:
                - $ref: "#/components/schemas/WorkspaceBriefingOutput"
                - type: "null"

    CampaignsListResult:
      allOf:
        - $ref: "#/components/schemas/AgentToolResultBase"
        - type: object
          properties:
            tool: { type: string, const: campaigns.list }
            data:
              oneOf:
                - $ref: "#/components/schemas/CampaignsListOutput"
                - type: "null"

    CampaignInspectResult:
      allOf:
        - $ref: "#/components/schemas/AgentToolResultBase"
        - type: object
          properties:
            tool: { type: string, const: campaign.inspect }
            data:
              oneOf:
                - $ref: "#/components/schemas/CampaignInspectOutput"
                - type: "null"

    SendingInspectResult:
      allOf:
        - $ref: "#/components/schemas/AgentToolResultBase"
        - type: object
          properties:
            tool: { type: string, const: sending.inspect }
