        campaignSending:
          description: Campaign-only execution counts, or null when unavailable. Excludes passive reply checks and tracking jobs.
          oneOf:
            - type: object
              additionalProperties: false
              required: [queuedJobs, runningJobs]
              properties:
                queuedJobs: { type: integer, minimum: 0 }
                runningJobs: { type: integer, minimum: 0 }
            - type: "null"
        assessment:
          type: object
          additionalProperties: false
          required: [scope, reason, nextAction]
          properties:
            scope: { type: string, enum: [campaign, workspace] }
            reason: { type: string }
            nextAction: { type: string }

    AgentLead:
      type: object
      additionalProperties: false
      required:
