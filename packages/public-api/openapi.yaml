openapi: 3.1.0
info:
  title: DM Faster Agent API
  version: 1.0.0
  description: |
    The stable API used by DM Faster agent clients. Every token is bound to one
    workspace. Campaign planning and private drafts use the same authoritative
    domain services as the app. Launch and pause require a short-lived server
    authorization bound to an exact campaign version and idempotency key. Owners
    may grant campaigns:control once when connecting an agent to act on their
    explicit instructions without a separate approval page for each action.
    Connections without that permission retain per-action browser approval.
    Browser-based launches first return a resumable setup handoff when no fresh
    browser worker is connected.
  license:
    name: Proprietary
servers:
  - url: https://app.dmfaster.com
    description: DM Faster application and Agent API.
tags:
  - name: Agent authentication
    description: Browser-approved login and revocation for local agent clients.
  - name: Agent tools
    description: Bounded tools backed by authoritative DM Faster domain services.
security:
  - bearerAuth: []
x-dmfaster-scopes:
  "workspace:read": Read workspace summary and aggregate worker state.
  "campaigns:read": Read campaign metadata and performance.
  "sending:read": Read browser-worker and sending health.
  "inbox:read": Read reply-attention data from the unified inbox.
  "pipeline:read": Read pipeline summaries and company outreach history.
  "audiences:read": Resolve industries and preview exact company audiences.
  "campaigns:write": Validate plans, prepare private drafts, and request confirmed pauses.
  "campaigns:launch": Request and execute separately approved campaign launches.
  "campaigns:control": With the action's normal scope, start or pause campaigns on explicit user instructions without per-action browser approval. Requires an owner grant at connection time.
paths:
  /api/v1/agent/auth/device:
    post:
      tags: [Agent authentication]
      operationId: startAgentDeviceAuthorization
      summary: Start browser-approved agent login
      description: |
        Creates a short-lived device authorization protected by PKCE S256. The
        returned device code and locally generated verifier must remain inside
        the client; only the secret-free verification URL is opened in the browser.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentDeviceAuthorizationInput"
      responses:
        "201":
          description: A five-minute browser authorization was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentDeviceAuthorizationResult"
        "400": { $ref: "#/components/responses/AuthBadRequest" }
        "429": { $ref: "#/components/responses/AuthTooManyRequests" }
        "503": { $ref: "#/components/responses/AuthServiceUnavailable" }

  /api/v1/agent/auth/token:
    post:
      tags: [Agent authentication]
      operationId: exchangeAgentDeviceAuthorization
      summary: Poll and exchange an approved agent login
      description: |
        Poll no faster than the interval returned by the start endpoint. An
        approved authorization can be exchanged exactly once.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentDeviceTokenInput"
      responses:
        "200":
          description: The browser authorization was approved and exchanged.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentDeviceTokenResult"
        "400": { $ref: "#/components/responses/AuthBadRequest" }
        "403": { $ref: "#/components/responses/AuthForbidden" }
        "409": { $ref: "#/components/responses/AuthConflict" }
        "428": { $ref: "#/components/responses/AuthPending" }
        "429": { $ref: "#/components/responses/AuthTooManyRequests" }
        "503": { $ref: "#/components/responses/AuthServiceUnavailable" }

  /api/v1/agent/auth/status:
    get:
      tags: [Agent authentication]
      operationId: getAgentAuthenticationStatus
      summary: Verify the current agent login
      responses:
        "200":
          description: The bearer credential is active and its workspace remains accessible.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentAuthenticationStatus"
        "401": { $ref: "#/components/responses/AuthUnauthorized" }
        "403": { $ref: "#/components/responses/AuthForbidden" }
        "429": { $ref: "#/components/responses/AuthTooManyRequests" }
        "503": { $ref: "#/components/responses/AuthServiceUnavailable" }

  /api/v1/agent/auth/revoke:
    post:
      tags: [Agent authentication]
      operationId: revokeAgentAuthentication
      summary: Revoke the current agent login
      responses:
        "200":
          description: The bearer credential was revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentAuthenticationRevoked"
        "401": { $ref: "#/components/responses/AuthUnauthorized" }
        "429": { $ref: "#/components/responses/AuthTooManyRequests" }
        "503": { $ref: "#/components/responses/AuthServiceUnavailable" }

  /api/v1/agent/tools/analytics.summary:
    post:
      tags: [Agent tools]
      operationId: analyticsSummary
      summary: Inspect an analytics summary
      description: Returns an authoritative analytics snapshot for an explicit time scope, optionally limited to one campaign. Read-only.
      x-dmfaster-effect: read
      x-dmfaster-required-scopes: ["workspace:read"]
      x-dmfaster-approval: none
      x-dmfaster-owner-only: false
      x-dmfaster-mcp:
        name: analytics_summary
        title: Analytics summary
        description: Read an authoritative analytics snapshot for an explicit time scope, optionally limited to one campaign identifier or exact name.
        annotations:
          readOnlyHint: true
          destructiveHint: false
          idempotentHint: true
          openWorldHint: false
      x-dmfaster-cli:
        section: Workspace reads
        usage: analytics summary --scope today|last_24_hours|campaign_to_date [--campaign ID_OR_NAME]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyticsSummaryInput"
      responses:
        "200":
          description: Analytics summary.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsSummaryResult"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalServerError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/v1/agent/tools/workspace.briefing:
    post:
      tags: [Agent tools]
      operationId: workspaceBriefing
      summary: Inspect the workspace briefing
      description: Returns an authoritative workspace, campaign, and sending summary. Read-only.
      x-dmfaster-effect: read
      x-dmfaster-required-scopes: ["workspace:read"]
      x-dmfaster-approval: none
      x-dmfaster-owner-only: false
      x-dmfaster-mcp:
        name: workspace_briefing
        title: Workspace briefing
        description: Start here when the user has not named a specific DM Faster resource. Read the authoritative workspace summary and current campaign and sending priorities.
        annotations:
          readOnlyHint: true
          destructiveHint: false
          idempotentHint: true
          openWorldHint: false
      x-dmfaster-cli:
        section: Workspace reads
        usage: workspace briefing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceBriefingInput"
      responses:
        "200":
          description: Workspace briefing.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceBriefingResult"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalServerError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/v1/agent/tools/campaigns.list:
    post:
      tags: [Agent tools]
      operationId: campaignsList
      summary: List campaigns
      description: Lists the most recently updated campaigns, optionally filtered by status. Read-only.
      x-dmfaster-effect: read
      x-dmfaster-required-scopes: ["campaigns:read"]
      x-dmfaster-approval: none
      x-dmfaster-owner-only: false
      x-dmfaster-mcp:
        name: campaigns_list
        title: List campaigns
        description: List campaigns in the current workspace, optionally filtered by status.
        annotations:
          readOnlyHint: true
          destructiveHint: false
          idempotentHint: true
          openWorldHint: false
      x-dmfaster-cli:
