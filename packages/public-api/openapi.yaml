          maxLength: 120
          minLength: 1
        companies:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              country:
                $ref: "#/components/schemas/SupportedCountry"
              businessId:
                type: string
                maxLength: 192
                minLength: 1
              expectedRevision:
                type: string
