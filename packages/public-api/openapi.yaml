    CampaignOperationInspectInput:
      type: object
      additionalProperties: false
      required:
        - campaignId
        - commandId
      properties:
        campaignId: &a1
          type: string
          minLength: 1
          maxLength: 160
        commandId:
          type: string
          minLength: 1
          maxLength: 160
          pattern: ^[A-Za-z0-9._:-]+$
    CampaignOperationInspectOutput:
      type: object
      additionalProperties: false
      required:
        - campaignId
        - commandId
        - runId
        - commandSequence
        - action
        - state
        - reason
        - senderAcknowledgedAt
        - createdAt
        - observedAt
      properties:
        campaignId: *a1
        commandId: *a1
        runId:
          type: string
        commandSequence:
          type: integer
        action:
          type: string
          enum:
            - start
            - stop
        state:
          type: string
          enum:
            - preparing_queue
            - superseded
            - blocked
            - stopped
            - sender_acknowledged
            - awaiting_sender
            - queue_prepared
        reason:
          type: string
        senderAcknowledgedAt:
          type:
            - string
            - "null"
        createdAt:
          type: string
        observedAt:
          type: string
    CampaignOperationInspectResult:
      allOf:
        - $ref: "#/components/schemas/AgentToolResultBase"
        - type: object
          properties:
            tool:
              type: string
              const: campaign.operation.inspect
            data:
              oneOf:
                - $ref: "#/components/schemas/CampaignOperationInspectOutput"
                - type: "null"
    CampaignDeliveryInspectInput:
      type: object
      additionalProperties: false
      required:
        - campaignId
      properties:
        campaignId: *a1
    CampaignDeliveryInspectOutput:
      type: object
      additionalProperties: true
      required:
        - campaignId
        - revision
        - settings
      properties:
        campaignId: *a1
        revision:
          type: string
        settings:
          type: object
          additionalProperties: true
        eligibility:
          type: object
          additionalProperties: true
    CampaignDeliveryInspectResult:
      allOf:
        - $ref: "#/components/schemas/AgentToolResultBase"
        - type: object
          properties:
            tool:
              type: string
              const: campaign.delivery.inspect
            data:
              oneOf:
                - $ref: "#/components/schemas/CampaignDeliveryInspectOutput"
                - type: "null"
    CampaignDeliveryUpdateInput:
      type: object
      additionalProperties: false
      required:
        - campaignId
        - expectedRevision
        - idempotencyKey
        - patch
      properties:
        campaignId: *a1
        expectedRevision:
          type: string
          pattern: ^[a-f0-9]{64}$
        idempotencyKey:
          type: string
          minLength: 1
          maxLength: 160
          pattern: ^[A-Za-z0-9._:-]+$
        patch:
          type: object
          additionalProperties: false
          properties:
            dailyCap:
              type: integer
              minimum: 1
              maximum: 2147483647
            pacingSeconds:
              type: integer
              minimum: 12
              maximum: 3600
            instagramSendingWindowEnabled:
              type: boolean
            instagramSendingWindowStartMinute:
              type: integer
              minimum: 0
              maximum: 1380
            instagramSendingWindowEndMinute:
              type: integer
              minimum: 60
              maximum: 1440
            instagramSendingWindowWeekdays:
              type: integer
              minimum: 1
              maximum: 127
          minProperties: 1
    CampaignDeliveryUpdateOutput:
      type: object
      additionalProperties: true
      required:
        - campaignId
        - revision
        - previous
        - settings
        - effectiveAt
        - replayed
      properties:
        campaignId: *a1
        revision:
          type: string
        previous:
          type: object
          additionalProperties: true
        settings:
          type: object
          additionalProperties: true
        effectiveAt:
          type: string
          const: next_attempt
        replayed:
          type: boolean
    CampaignDeliveryUpdateResult:
      allOf:
        - $ref: "#/components/schemas/AgentToolResultBase"
        - type: object
          properties:
            tool:
              type: string
              const: campaign.delivery.update
            data:
              oneOf:
                - $ref: "#/components/schemas/CampaignDeliveryUpdateOutput"
                - type: "null"
