      x-dmfaster-effect: read
      x-dmfaster-required-scopes: ["campaigns:read"]
      x-dmfaster-approval: none
      x-dmfaster-owner-only: false
      x-dmfaster-mcp:
        name: campaign_inspect
        title: Inspect campaign
        description: Read delivery, outcome, and pipeline facts for a campaign identifier returned by DM Faster.
        annotations:
          readOnlyHint: true
          destructiveHint: false
          idempotentHint: true
          openWorldHint: false
      x-dmfaster-cli:
        section: Workspace reads
        usage: campaign inspect [CAMPAIGN_ID]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CampaignInspectInput"
      responses:
        "200":
          description: Campaign performance.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampaignInspectResult"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalServerError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

