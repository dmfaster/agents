          items: { $ref: "#/components/schemas/TargetChannel" }
        messageLanguage: { type: string }
        tone: { type: string }
        dailyVolume:
          oneOf:
            - { type: number }
            - type: "null"
        deliverySettings:
          $ref: "#/components/schemas/AgentCampaignDeliverySettings"
        outreachMessages:
          type: array
          items: { $ref: "#/components/schemas/AgentOutreachMessage" }

    AgentCompanySize:
      type: object
      additionalProperties: false
      required: [employeeMin, employeeMax, revenueMinEur, revenueMaxEur]
      properties:
        employeeMin:
          oneOf: [{ type: number }, { type: "null" }]
        employeeMax:
          oneOf: [{ type: number }, { type: "null" }]
        revenueMinEur:
          oneOf: [{ type: number }, { type: "null" }]
        revenueMaxEur:
          oneOf: [{ type: number }, { type: "null" }]

    AgentMetaAdsFilter:
      type: object
      additionalProperties: false
      required: [minimumEuReach, targetAge, targetGender, targetLocation, includeUncorroborated]
      properties:
        minimumEuReach:
          oneOf: [{ type: integer, minimum: 0, maximum: 100000000 }, { type: "null" }]
        targetAge:
          oneOf: [{ type: integer, minimum: 13, maximum: 65 }, { type: "null" }]
        targetGender:
          oneOf: [{ type: string, enum: [all, men, women] }, { type: "null" }]
        targetLocation: { type: string, maxLength: 80 }
        includeUncorroborated: { type: boolean }

    AgentSignalCriterion:
      type: object
      additionalProperties: false
      required: [key, required, description]
      properties:
        key:
          type: string
          enum:
            [
              recent_funding,
              active_hiring,
              leadership_change,
              technology_usage,
              content_activity,
              purchase_intent,
            ]
        required: { type: boolean }
        description: { type: string }

    AgentCampaignDeliverySettings:
      type: object
      additionalProperties: false
      required: [dailyCap, windowStart, windowEnd, weekdays, timezone, confirmed]
      properties:
        dailyCap:
          oneOf: [{ type: number }, { type: "null" }]
        windowStart: { type: string }
        windowEnd: { type: string }
        weekdays: { type: integer, minimum: 1, maximum: 127 }
        timezone: { type: string }
        confirmed: { type: boolean }

    AgentOutreachMessage:
      type: object
      additionalProperties: false
      required: [channels, subject, body, origin]
      properties:
        channels:
          type: array
          items: { $ref: "#/components/schemas/TargetChannel" }
        subject: { type: string }
        body: { type: string }
        origin:
          type: string
          enum: [user, user_requested_generation, agent_draft, user_approved_generation]

    AgentIndustryCodeSelection:
      type: object
      additionalProperties: false
      required: [classification, version, codes]
      properties:
        classification: { type: string, const: TOL }
        version: { $ref: "#/components/schemas/TolVersion" }
        codes:
          type: array
          maxItems: 64
          items: { type: string, maxLength: 5 }

    AgentIndustryClarificationOption:
      type: object
      additionalProperties: false
      required: [id, label, selections]
      properties:
        id: { type: string, maxLength: 80 }
        label: { type: string, maxLength: 180 }
        selections:
          type: array
          maxItems: 2
          items: { $ref: "#/components/schemas/AgentIndustryCodeSelection" }

    AgentIndustryResolution:
      type: object
      additionalProperties: false
      required:
        [status, sourceText, resolvedLabel, primaryVersion, selections, question, options, evidence]
      properties:
        status: { type: string, enum: [resolved, needs_clarification, unsupported] }
        sourceText: { type: string, maxLength: 800 }
        resolvedLabel: { type: string, maxLength: 240 }
        primaryVersion: { $ref: "#/components/schemas/TolVersion" }
        selections:
          type: array
          maxItems: 2
          items: { $ref: "#/components/schemas/AgentIndustryCodeSelection" }
        question: { type: string, maxLength: 500 }
        options:
          type: array
          maxItems: 3
          items: { $ref: "#/components/schemas/AgentIndustryClarificationOption" }
        evidence:
          type: array
          maxItems: 12
          items: { type: string, maxLength: 120 }

    IndustryLookupOutput:
      type: object
      additionalProperties: false
      required: [resolution]
      properties:
        resolution:
          $ref: "#/components/schemas/AgentIndustryResolution"

    AgentHarnessResult:
      type: object
      additionalProperties: false
      required:
        [
          version,
          action,
          status,
          executionMode,
          summary,
          blockers,
          allowedNextActions,
          resourceRefs,
          approval,
          data,
        ]
      properties:
        version: { type: integer, const: 1 }
        action:
          type: string
          enum:
            [
              get_workspace_capabilities,
              validate_campaign_plan,
              preview_audience,
              prepare_list,
              prepare_campaign,
              preflight_campaign_launch,
              launch_campaign,
              pause_campaign,
            ]
        status:
          type: string
          enum: [success, needs_input, needs_approval, blocked, failed]
        executionMode:
          type: string
          enum: [read_only, simulation, live]
        summary: { type: string }
        blockers:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [code, message, recoverable]
            properties:
              code: { type: string }
              message: { type: string }
              recoverable: { type: boolean }
        allowedNextActions:
          type: array
          items: { type: string }
        resourceRefs:
          type: object
          additionalProperties: false
          properties:
            targetListId: { type: string }
            targetListUpdatedAt: { type: string, format: date-time }
            campaignId: { type: string }
            campaignUpdatedAt: { type: string, format: date-time }
            preparationFingerprint: { type: string }
            executionTimezone: { type: string }
        approval:
          oneOf:
            - type: object
              additionalProperties: true
            - type: "null"
        data: {}

    AudiencePreviewHarnessData:
      type: object
      additionalProperties: true
      description: Exact preview data plus the opaque audience identity required by preparation calls.
      required: [reviewedAudience]
      properties:
        reviewedAudience:
          oneOf:
            - $ref: "#/components/schemas/ReviewedAudience"
            - type: "null"

    AudiencePreviewHarnessResult:
      allOf:
        - $ref: "#/components/schemas/AgentHarnessResult"
        - type: object
          properties:
            data:
              oneOf:
                - $ref: "#/components/schemas/AudiencePreviewHarnessData"
                - type: "null"

    AgentCampaignAction:
      type: string
      enum: [campaign.launch, campaign.pause]

    AgentActionSnapshot:
      type: object
      additionalProperties: false
      required:
        [
          campaignId,
          campaignName,
          campaignStatus,
          campaignUpdatedAt,
          targetListId,
          targetCount,
          channels,
          dailyCap,
        ]
      properties:
        campaignId: { type: string }
        campaignName: { type: string }
        campaignStatus: { $ref: "#/components/schemas/CampaignStatus" }
        campaignUpdatedAt: { type: string, format: date-time }
        targetListId: { type: string }
        targetCount: { type: integer, minimum: 0 }
        channels:
          type: array
          uniqueItems: true
          items: { $ref: "#/components/schemas/TargetChannel" }
        dailyCap: { type: integer, minimum: 0 }
        deliveryNotice:
          type: string
          maxLength: 1000
          description: Delivery restrictions the caller must disclose when summarizing the launch, including manual runs ending at local midnight.

    AgentActionAuthorization:
      type: object
      additionalProperties: false
      required:
        [
          id,
          action,
          campaignId,
          commandId,
          confirmationCode,
          status,
          expiresAt,
          approvedAt,
          deniedAt,
          consumedAt,
          snapshot,
        ]
      properties:
        id: { type: string, pattern: "^agent_action_[a-f0-9]{32}$" }
        action: { $ref: "#/components/schemas/AgentCampaignAction" }
        campaignId: { type: string }
        commandId: { type: string }
        confirmationCode: { type: string, pattern: "^[A-HJ-NP-Z2-9]{4}-[A-HJ-NP-Z2-9]{4}$" }
        status: { type: string, enum: [pending, approved, denied, consumed, expired] }
        expiresAt: { type: string, format: date-time }
        approvedAt: { type: string }
        deniedAt: { type: string }
        consumedAt: { type: string }
        snapshot: { $ref: "#/components/schemas/AgentActionSnapshot" }
        approvalMethod:
          type: string
          enum: [in_app_approval, connection_permission]

    CampaignActionReadyOutput:
      type: object
      additionalProperties: false
      required: [status, authorization]
      properties:
        status: { type: string, const: ready }
        authorization: { $ref: "#/components/schemas/AgentActionAuthorization" }

    CampaignActionApprovalRequiredOutput:
      type: object
      additionalProperties: false
      required: [status, authorization, approvalUrl]
      properties:
        status: { type: string, const: approval_required }
        authorization: { $ref: "#/components/schemas/AgentActionAuthorization" }
        approvalUrl: { type: string, format: uri }

    BrowserWorkerSetupResume:
      type: object
      additionalProperties: false
      required: [tool, input]
      properties:
        tool: { type: string, const: campaign.launch.preflight }
        input: { $ref: "#/components/schemas/CampaignActionPreflightInput" }

    BrowserWorkerSetupRequirement:
      type: object
      additionalProperties: false
      required: [code, state, setupUrl, message, userActionRequired, campaignChannels, resume]
      properties:
        code: { type: string, const: browser_worker_required }
        state:
          type: string
          enum: [not_connected, offline]
        setupUrl: { type: string, format: uri }
        message:
          type: string
          minLength: 1
          maxLength: 500
        userActionRequired: { type: boolean, const: true }
        campaignChannels:
          type: array
          uniqueItems: true
          items: { $ref: "#/components/schemas/TargetChannel" }
        resume: { $ref: "#/components/schemas/BrowserWorkerSetupResume" }

    CampaignLaunchSetupRequiredOutput:
      type: object
      additionalProperties: false
      required: [status, setup]
      properties:
        status: { type: string, const: setup_required }
        setup: { $ref: "#/components/schemas/BrowserWorkerSetupRequirement" }

    CampaignActionPreflightOutput:
      oneOf:
        - $ref: "#/components/schemas/CampaignActionReadyOutput"
        - $ref: "#/components/schemas/CampaignActionApprovalRequiredOutput"
        - $ref: "#/components/schemas/CampaignLaunchSetupRequiredOutput"
      discriminator:
        propertyName: status
        mapping:
          ready: "#/components/schemas/CampaignActionReadyOutput"
          approval_required: "#/components/schemas/CampaignActionApprovalRequiredOutput"
          setup_required: "#/components/schemas/CampaignLaunchSetupRequiredOutput"

    CampaignActionOutput:
      type: object
      additionalProperties: false
      required: [action, campaign, authorizationId, idempotencyKey, replayed]
      properties:
        action: { $ref: "#/components/schemas/AgentCampaignAction" }
        campaign: { $ref: "#/components/schemas/AgentActionSnapshot" }
        authorizationId: { type: string, pattern: "^agent_action_[a-f0-9]{32}$" }
        idempotencyKey: { $ref: "#/components/schemas/IdempotencyKey" }
        operation:
          type: object
          additionalProperties: false
          required: [tool, input]
          properties:
            tool: { type: string, const: campaign.operation.inspect }
            input: { $ref: "#/components/schemas/CampaignOperationInspectInput" }
        replayed: { type: boolean }

    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/Error"

    Error:
      type: object
      additionalProperties: false
      required: [code, message, retryable, requestId]
      properties:
        code:
          type: string
          enum:
            - invalid_request
            - unauthorized
            - insufficient_scope
            - not_found
            - rate_limited
            - internal_error
            - service_unavailable
        message:
          type: string
          minLength: 1
          maxLength: 500
        retryable:
          type: boolean
        requestId:
          type: string
          minLength: 1
          maxLength: 128
        details:
          type: object
          additionalProperties: true

    CampaignStatus:
      type: string
      enum: [Draft, Queued, Running, Paused, Cooldown, Completed]

    TargetChannel:
      type: string
      enum: [instagram, facebook, linkedin, gmail, sms]

    InboxChannel:
      type: string
      enum: [instagram, facebook, linkedin, gmail, outlook, email, sms]

    PipelineStage:
      type: string
      enum: [contacted, replied, call_booked, closed]

    CampaignSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - status
        - channels
        - targetCount
        - sentCount
        - dailyCap
        - updatedAt
      properties:
        id:
          type: string
        name:
          type: string
        status:
          $ref: "#/components/schemas/CampaignStatus"
        channels:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/TargetChannel"
        targetCount: { type: integer, minimum: 0 }
        sentCount: { type: integer, minimum: 0 }
        dailyCap: { type: integer, minimum: 0 }
        updatedAt:
          type: string
          format: date-time

    CampaignCounts:
      type: object
      additionalProperties: false
      required: [Draft, Queued, Running, Paused, Cooldown, Completed]
      properties:
        Draft: { type: integer, minimum: 0 }
        Queued: { type: integer, minimum: 0 }
        Running: { type: integer, minimum: 0 }
        Paused: { type: integer, minimum: 0 }
        Cooldown: { type: integer, minimum: 0 }
        Completed: { type: integer, minimum: 0 }

    PipelineCounts:
      type: object
      additionalProperties: false
      required: [contacted, replied, call_booked, closed]
      properties:
        contacted: { type: integer, minimum: 0 }
        replied: { type: integer, minimum: 0 }
        call_booked: { type: integer, minimum: 0 }
        closed: { type: integer, minimum: 0 }

    SendingSummary:
      type: object
      additionalProperties: false
      required:
        - activeWorkers
        - offlineWorkers
        - queuedJobs
        - runningJobs
        - completedToday
        - queueState
        - lastWorkerSeenAt
      properties:
        activeWorkers: { type: integer, minimum: 0 }
        offlineWorkers: { type: integer, minimum: 0 }
        queuedJobs: { type: integer, minimum: 0 }
        runningJobs: { type: integer, minimum: 0 }
        completedToday: { type: integer, minimum: 0 }
        queueState:
          type: string
          enum: [idle, queued, running, waiting_for_browser]
        lastWorkerSeenAt:
          type: string
          description: ISO 8601 timestamp, or an empty string when no worker has been observed.

    AnalyticsSummaryOutput:
      type: object
      additionalProperties: false
      required:
        - version
        - generatedAt
        - asOf
        - scope
        - timezone
        - window
        - campaign
        - counts
        - rates
        - formulas
        - coverage
        - sources
        - snapshotId
      properties:
        version: { type: integer, const: 1 }
        generatedAt: { type: string, format: date-time }
        asOf: { type: string, format: date-time }
        scope:
          type: string
          enum: [today, last_24_hours, campaign_to_date]
        timezone: { type: string, minLength: 1 }
        window:
          type: object
          additionalProperties: false
          required: [start, end, label]
          properties:
            start:
              oneOf:
                - { type: string, format: date-time }
                - { type: "null" }
            end: { type: string, format: date-time }
            label: { type: string, minLength: 1 }
        campaign:
          oneOf:
            - type: object
              additionalProperties: false
              required: [id, name]
              properties:
                id: { type: string, minLength: 1 }
                name: { type: string, minLength: 1 }
            - type: "null"
        counts:
          type: object
          additionalProperties: false
          required: [sent, reachedCompanies, replies, replyingCompanies, bookedCalls]
          properties:
            sent: { type: integer, minimum: 0 }
            reachedCompanies: { type: integer, minimum: 0 }
            replies: { type: integer, minimum: 0 }
            replyingCompanies: { type: integer, minimum: 0 }
            bookedCalls: { type: integer, minimum: 0 }
        rates:
          type: object
          additionalProperties: false
          required: [replyRateByCompanies, replyRateByMessages]
          properties:
            replyRateByCompanies:
              oneOf: [{ type: number, minimum: 0 }, { type: "null" }]
            replyRateByMessages:
              oneOf: [{ type: number, minimum: 0 }, { type: "null" }]
        formulas:
          type: object
          additionalProperties: false
          required: [replyRateByCompanies, replyRateByMessages]
          properties:
            replyRateByCompanies: { type: string, minLength: 1 }
            replyRateByMessages: { type: string, minLength: 1 }
        coverage:
          type: object
          additionalProperties: false
          required: [sent, reachedCompanies, replies, bookedCalls]
          properties:
            sent: { type: string, enum: [complete, partial, unavailable] }
            reachedCompanies: { type: string, enum: [complete, partial, unavailable] }
            replies: { type: string, enum: [complete, partial, unavailable] }
            bookedCalls: { type: string, enum: [complete, partial, unavailable] }
        sources:
          type: object
          additionalProperties: false
          required: [sent, reachedCompanies, replies, bookedCalls]
          properties:
            sent: { type: string, minLength: 1 }
            reachedCompanies: { type: string, minLength: 1 }
            replies: { type: string, minLength: 1 }
            bookedCalls: { type: string, minLength: 1 }
        snapshotId: { type: string, minLength: 1 }

    WorkspaceBriefingOutput:
      type: object
      additionalProperties: false
      required:
        - generatedAt
        - selectedCampaignId
        - campaignCounts
        - totals
        - sending
        - focusCampaign
      properties:
        generatedAt:
          type: string
          format: date-time
        selectedCampaignId:
          type: string
        campaignCounts:
          $ref: "#/components/schemas/CampaignCounts"
        totals:
          type: object
          additionalProperties: false
          required: [campaigns, targetLists, sent]
          properties:
            campaigns: { type: integer, minimum: 0 }
            targetLists: { type: integer, minimum: 0 }
            sent: { type: integer, minimum: 0 }
        sending:
          $ref: "#/components/schemas/SendingSummary"
        focusCampaign:
          oneOf:
            - $ref: "#/components/schemas/CampaignSummary"
            - type: "null"

    CampaignsListOutput:
      type: object
      additionalProperties: false
      required: [generatedAt, campaigns, totalCount, hasMore, nextCursor]
      properties:
        generatedAt:
          type: string
          format: date-time
        campaigns:
          type: array
          maxItems: 25
          items:
            $ref: "#/components/schemas/CampaignSummary"
        totalCount:
          type: integer
          minimum: 0
          description: Exact number of campaigns matching the supplied filters at this page's collection revision.
        hasMore:
          type: boolean
        nextCursor:
          oneOf:
            - type: string
              minLength: 1
              maxLength: 500
            - type: "null"

    CampaignCopyInspectOutput:
      type: object
      additionalProperties: false
      required:
        - campaignId
        - campaignUpdatedAt
        - name
        - status
        - channels
        - messageVariants
        - linkedinInviteMode
        - linkedinInviteNote
        - followUpSequence
        - linkedinFollowUpSequence
        - linkedinAcceptedMessage
      properties:
        campaignId:
          $ref: "#/components/schemas/ResourceId"
        campaignUpdatedAt:
          $ref: "#/components/schemas/ResourceVersion"
        name: { type: string }
        status:
          $ref: "#/components/schemas/CampaignStatus"
        channels:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/TargetChannel"
        messageVariants:
          description: Saved Instagram/Facebook opening copy. This is not the LinkedIn accepted message.
          type: array
          items: { type: string }
        linkedinInviteMode:
          type: string
          enum: [invite_only, invite_with_note]
        linkedinInviteNote: { type: string }
        followUpSequence:
          oneOf:
            - $ref: "#/components/schemas/CampaignFollowUpSequenceOutput"
            - type: "null"
        linkedinFollowUpSequence:
          oneOf:
            - $ref: "#/components/schemas/CampaignFollowUpSequenceOutput"
            - type: "null"
        linkedinAcceptedMessage:
          type: object
          additionalProperties: false
          required: [configured, sequenceSource, messageVariants]
          properties:
            configured: { type: boolean }
            sequenceSource:
              type: string
              enum: [none, followUpSequence, linkedinFollowUpSequence]
            messageVariants:
              type: array
              items: { type: string }
          description: >-
            Step 1 is queued when acceptance is observed or when the prospect
            is already connected, subject to sending controls and recorded
            cross-channel human reply suppression. A required delayDays on
            step 1 does not delay this accepted message.

    CampaignInspectOutput:
      type: object
      additionalProperties: false
      required:
        - generatedAt
        - campaign
        - execution
        - pipeline
        - rates
      properties:
        generatedAt:
          type: string
          format: date-time
        campaign:
          $ref: "#/components/schemas/CampaignSummary"
        execution:
