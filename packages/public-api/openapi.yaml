openapi: 3.1.0
info:
  title: DM Faster Agent API
  version: 1.0.0
  description: |
    The stable API used by DM Faster agent clients. Every token is bound to one
    workspace. Campaign planning and private drafts use the same authoritative
    domain services as the app. Launch and pause require a short-lived server
    authorization bound to an exact campaign version and idempotency key. Owners
    may grant campaigns:control once when connecting an agent to act on their
    explicit instructions without a separate approval page for each action.
    Connections without that permission retain per-action browser approval.
    Browser-based launches first return a resumable setup handoff when no fresh
    browser worker is connected.
  license:
    name: Proprietary
servers:
  - url: https://app.dmfaster.com
    description: DM Faster application and Agent API.
tags:
  - name: Agent authentication
    description: Browser-approved login and revocation for local agent clients.
  - name: Agent tools
    description: Bounded tools backed by authoritative DM Faster domain services.
security:
  - bearerAuth: []
x-dmfaster-scopes:
  "workspace:read": Read workspace summary and aggregate worker state.
  "campaigns:read": Read campaign metadata and performance.
  "sending:read": Read browser-worker and sending health.
  "inbox:read": Read reply-attention data from the unified inbox.
  "inbox:write": Update conversations and send explicitly instructed replies.
  "pipeline:read": Read pipeline summaries and company outreach history.
  "pipeline:write": Update prospect stages and notes.
  "audiences:read": Resolve industries and preview exact company audiences.
  "campaigns:write": Validate plans, prepare private drafts, and request confirmed pauses.
  "campaigns:launch": Request and execute separately approved campaign launches.
  "campaigns:control": With the action's normal scope, start or pause campaigns on explicit user instructions without per-action browser approval. Requires an owner grant at connection time.
  "calendar:read": Inspect calendar connection and bounded availability.
  "calendar:write": Book explicitly instructed meetings and send calendar invitations.
  "calls:read": Read authorized meeting details and outcomes.
  leads:read: Read social prospecting jobs, profile enrichment and exact lead credit balance.
  leads:write: Spend lead credits on explicitly instructed social extraction and profile enrichment
    jobs. Requires the workspace owner.
paths:
  /api/v1/agent/auth/device:
    post:
      tags: [Agent authentication]
      operationId: startAgentDeviceAuthorization
      summary: Start browser-approved agent login
      description: |
        Creates a short-lived device authorization protected by PKCE S256. The
        returned device code and locally generated verifier must remain inside
        the client; only the secret-free verification URL is opened in the browser.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentDeviceAuthorizationInput"
      responses:
        "201":
          description: A five-minute browser authorization was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentDeviceAuthorizationResult"
        "400": { $ref: "#/components/responses/AuthBadRequest" }
        "429": { $ref: "#/components/responses/AuthTooManyRequests" }
        "503": { $ref: "#/components/responses/AuthServiceUnavailable" }

  /api/v1/agent/auth/token:
    post:
      tags: [Agent authentication]
      operationId: exchangeAgentDeviceAuthorization
      summary: Poll and exchange an approved agent login
      description: |
        Poll no faster than the interval returned by the start endpoint. An
        approved authorization can be exchanged exactly once.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentDeviceTokenInput"
      responses:
        "200":
          description: The browser authorization was approved and exchanged.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentDeviceTokenResult"
        "400": { $ref: "#/components/responses/AuthBadRequest" }
        "403": { $ref: "#/components/responses/AuthForbidden" }
        "409": { $ref: "#/components/responses/AuthConflict" }
        "428": { $ref: "#/components/responses/AuthPending" }
        "429": { $ref: "#/components/responses/AuthTooManyRequests" }
        "503": { $ref: "#/components/responses/AuthServiceUnavailable" }

  /api/v1/agent/auth/status:
    get:
      tags: [Agent authentication]
      operationId: getAgentAuthenticationStatus
      summary: Verify the current agent login
      responses:
        "200":
          description: The bearer credential is active and its workspace remains accessible.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentAuthenticationStatus"
        "401": { $ref: "#/components/responses/AuthUnauthorized" }
        "403": { $ref: "#/components/responses/AuthForbidden" }
        "429": { $ref: "#/components/responses/AuthTooManyRequests" }
        "503": { $ref: "#/components/responses/AuthServiceUnavailable" }

  /api/v1/agent/auth/revoke:
    post:
      tags: [Agent authentication]
      operationId: revokeAgentAuthentication
      summary: Revoke the current agent login
      responses:
        "200":
          description: The bearer credential was revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentAuthenticationRevoked"
        "401": { $ref: "#/components/responses/AuthUnauthorized" }
        "429": { $ref: "#/components/responses/AuthTooManyRequests" }
        "503": { $ref: "#/components/responses/AuthServiceUnavailable" }

  /api/v1/agent/tools/analytics.summary:
    post:
      tags: [Agent tools]
      operationId: analyticsSummary
      summary: Inspect an analytics summary
      description: Returns an authoritative analytics snapshot for an explicit time scope, optionally limited to one campaign. Read-only.
      x-dmfaster-effect: read
      x-dmfaster-required-scopes: ["workspace:read"]
      x-dmfaster-approval: none
      x-dmfaster-owner-only: false
      x-dmfaster-mcp:
        name: analytics_summary
        title: Analytics summary
        description: Read an authoritative analytics snapshot for an explicit time scope, optionally limited to one campaign identifier or exact name.
        annotations:
          readOnlyHint: true
          destructiveHint: false
          idempotentHint: true
          openWorldHint: false
      x-dmfaster-cli:
        section: Workspace reads
        usage: analytics summary --scope today|last_24_hours|campaign_to_date [--campaign ID_OR_NAME]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyticsSummaryInput"
      responses:
        "200":
          description: Analytics summary.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsSummaryResult"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalServerError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/v1/agent/tools/workspace.briefing:
    post:
      tags: [Agent tools]
      operationId: workspaceBriefing
      summary: Inspect the workspace briefing
      description: Returns an authoritative workspace, campaign, and sending summary. Read-only.
      x-dmfaster-effect: read
      x-dmfaster-required-scopes: ["workspace:read"]
      x-dmfaster-approval: none
      x-dmfaster-owner-only: false
      x-dmfaster-mcp:
        name: workspace_briefing
        title: Workspace briefing
        description: Start here when the user has not named a specific DM Faster resource. Read the authoritative workspace summary and current campaign and sending priorities.
        annotations:
          readOnlyHint: true
          destructiveHint: false
          idempotentHint: true
          openWorldHint: false
      x-dmfaster-cli:
        section: Workspace reads
        usage: workspace briefing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceBriefingInput"
      responses:
        "200":
          description: Workspace briefing.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceBriefingResult"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalServerError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/v1/agent/tools/campaigns.list:
    post:
      tags: [Agent tools]
      operationId: campaignsList
      summary: List campaigns
      description: Lists campaigns with exact filtered totals and a continuation cursor. A changed collection rejects the cursor so callers can restart without silently skipping a campaign. Read-only.
      x-dmfaster-effect: read
      x-dmfaster-required-scopes: ["campaigns:read"]
      x-dmfaster-approval: none
      x-dmfaster-owner-only: false
      x-dmfaster-mcp:
        name: campaigns_list
        title: List campaigns
        description: Search and page through campaigns in the current workspace. Reuse nextCursor until hasMore is false; restart if the collection changes.
        annotations:
          readOnlyHint: true
          destructiveHint: false
          idempotentHint: true
          openWorldHint: false
      x-dmfaster-cli:
        section: Workspace reads
        usage: campaigns list [--status STATUS] [--query TEXT] [--channel CHANNEL] [--limit N] [--cursor CURSOR]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CampaignsListInput"
      responses:
        "200":
          description: Campaign list.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampaignsListResult"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalServerError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/v1/agent/tools/campaign.inspect:
    post:
      tags: [Agent tools]
      operationId: campaignInspect
      summary: Inspect campaign settings and performance
      description: |
        Returns saved social copy and delivery settings alongside execution and
        pipeline facts. When campaignId is omitted, the selected, active, or most
        recent campaign is used. Read-only. Use campaign.copy.inspect for exact
        LinkedIn invitation and accepted-message settings.
      x-dmfaster-effect: read
      x-dmfaster-required-scopes: ["campaigns:read"]
      x-dmfaster-approval: none
      x-dmfaster-owner-only: false
      x-dmfaster-mcp:
        name: campaign_inspect
        title: Inspect campaign
        description: Read saved social copy, delivery, outcomes, and pipeline facts for a campaign identifier returned by DM Faster. Use campaign_copy_inspect for LinkedIn invitation and accepted-message settings.
        annotations:
          readOnlyHint: true
          destructiveHint: false
          idempotentHint: true
          openWorldHint: false
      x-dmfaster-cli:
        section: Workspace reads
        usage: campaign inspect [CAMPAIGN_ID]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CampaignInspectInput"
      responses:
        "200":
          description: Campaign performance.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampaignInspectResult"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalServerError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/v1/agent/tools/campaign.copy.inspect:
    post:
      tags: [Agent tools]
      operationId: campaignCopyInspect
      summary: Inspect exact social and LinkedIn campaign copy
      description: |
        Read the exact saved opening copy, LinkedIn invitation mode and note,
        both follow-up sequences, and the effective first LinkedIn message.
        The first LinkedIn message is queued on verified acceptance or when the
        prospect is already connected; a recorded human reply on any channel
        for the same company in this campaign suppresses unsent messages.
        Read-only. Requires an exact campaign identifier returned by DM Faster.
      x-dmfaster-effect: read
      x-dmfaster-required-scopes: ["campaigns:read"]
      x-dmfaster-approval: none
      x-dmfaster-owner-only: false
      x-dmfaster-mcp:
        name: campaign_copy_inspect
        title: Inspect campaign copy and LinkedIn sequence
        description: Read exact saved social opening copy, LinkedIn invitation settings, both sequences and effective accepted-message variants for a campaign identifier returned by DM Faster.
        annotations:
          readOnlyHint: true
          destructiveHint: false
          idempotentHint: true
          openWorldHint: false
      x-dmfaster-cli:
        section: Workspace reads
        usage: campaign copy inspect CAMPAIGN_ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CampaignCopyInspectInput"
      responses:
        "200":
          description: Exact campaign copy and LinkedIn settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampaignCopyInspectResult"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalServerError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/v1/agent/tools/sending.inspect:
    post:
      tags: [Agent tools]
      operationId: sendingInspect
      summary: Inspect sending health
      description: |
        Returns customer-facing campaign, queue, and browser-worker health. When campaignId
        is omitted, the selected, active, or most recent campaign is used. Read-only.
      x-dmfaster-effect: read
      x-dmfaster-required-scopes: ["sending:read"]
      x-dmfaster-approval: none
      x-dmfaster-owner-only: false
      x-dmfaster-mcp:
        name: sending_inspect
        title: Inspect sending health
        description: Read browser-worker, queue, and failed-send health for the workspace or one campaign.
        annotations:
          readOnlyHint: true
          destructiveHint: false
          idempotentHint: true
          openWorldHint: false
      x-dmfaster-cli:
        section: Workspace reads
        usage: sending inspect [CAMPAIGN_ID]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendingInspectInput"
      responses:
        "200":
          description: Sending health.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendingInspectResult"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalServerError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/v1/agent/tools/replies.list:
    post:
      tags: [Agent tools]
      operationId: repliesList
      summary: List priority replies
      description: |
        Returns bounded reply-attention records from the pipeline. When campaignId
        is omitted, the selected, active, or most recent campaign is used. Read-only.
      x-dmfaster-effect: read
      x-dmfaster-required-scopes: ["inbox:read"]
      x-dmfaster-approval: none
      x-dmfaster-owner-only: false
      x-dmfaster-mcp:
        name: replies_list
        title: List priority replies
        description: Read actual reply-stage records that need attention. Never infer replies from sent counts.
        annotations:
          readOnlyHint: true
          destructiveHint: false
          idempotentHint: true
          openWorldHint: false
      x-dmfaster-cli:
        section: Workspace reads
        usage: replies list [CAMPAIGN_ID] [--limit N] [--query TEXT]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepliesListInput"
      responses:
        "200":
          description: Priority replies.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepliesListResult"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalServerError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/v1/agent/tools/conversations.list:
    post:
      tags: [Agent tools]
      operationId: conversationsList
      summary: List inbox conversations
      description: Lists actual inbox conversations with app filters and a continuation cursor. Read-only; listing does not mark messages read.
      x-dmfaster-effect: read
      x-dmfaster-required-scopes: ["inbox:read"]
      x-dmfaster-approval: none
      x-dmfaster-owner-only: false
      x-dmfaster-mcp:
        name: conversations_list
        title: List inbox conversations
        description: Find actual inbox conversations by status, campaign, channel, and text. Page with the returned cursor; listing never marks a conversation read.
        annotations:
          readOnlyHint: true
          destructiveHint: false
          idempotentHint: true
          openWorldHint: false
      x-dmfaster-cli:
        section: Inbox
        usage: conversations list [--filter FILTER] [--channel CHANNEL] [--campaign-id ID] [--query TEXT] [--limit N] [--cursor CURSOR] [--input FILE]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConversationsListInput"
      responses:
        "200":
          description: Inbox conversation page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationsListResult"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalServerError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/v1/agent/tools/conversation.inspect:
    post:
      tags: [Agent tools]
      operationId: conversationInspect
      summary: Read one inbox conversation
      description: Reads an exact workspace conversation and one bounded page of actual messages, including attachment metadata. Read-only; inspection does not mark messages read.
      x-dmfaster-effect: read
      x-dmfaster-required-scopes: ["inbox:read"]
      x-dmfaster-approval: none
      x-dmfaster-owner-only: false
      x-dmfaster-mcp:
        name: conversation_inspect
        title: Read inbox conversation
        description: Read an exact conversation's inbound and outbound message page. Pass nextCursor with the same conversation ID to continue.
        annotations:
          readOnlyHint: true
          destructiveHint: false
          idempotentHint: true
          openWorldHint: false
      x-dmfaster-cli:
        section: Inbox
        usage: conversation inspect CONVERSATION_ID [--limit N] [--cursor CURSOR] [--input FILE]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConversationInspectInput"
      responses:
        "200":
          description: Conversation and message page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationInspectResult"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalServerError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/v1/agent/tools/conversation.update:
    post:
      tags: [Agent tools]
      operationId: conversationUpdate
      summary: Update one inbox conversation
      description: Applies one bounded inbox action to the exact inspected conversation version. Never sends a message.
      x-dmfaster-effect: write
      x-dmfaster-required-scopes: ["inbox:read", "inbox:write"]
      x-dmfaster-approval: none
      x-dmfaster-owner-only: true
      x-dmfaster-mcp:
        name: conversation_update
        title: Update inbox conversation
        description: Mark read or unread, close or reopen, snooze, assign, or set interest on one inspected conversation. Echo its updatedAt.
        annotations:
          {
            readOnlyHint: false,
            destructiveHint: false,
            idempotentHint: true,
            openWorldHint: false,
          }
      x-dmfaster-cli:
        section: Inbox
        usage: conversation update --input FILE
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConversationUpdateInput" }
      responses:
        "200":
          description: Updated conversation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConversationUpdateResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalServerError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/v1/agent/tools/conversation.reply:
    post:
      tags: [Agent tools]
      operationId: conversationReply
      summary: Send an instructed reply to one conversation
      description: Queue or send the exact user-approved text only when the inspected conversation still has the same inbound and latest message. A durable idempotency key prevents duplicate replies. A queued receipt does not prove delivery.
      x-dmfaster-effect: external
      x-dmfaster-required-scopes: ["inbox:read", "inbox:write"]
      x-dmfaster-approval: human_confirmation
      x-dmfaster-owner-only: true
      x-dmfaster-mcp:
        name: conversation_reply
        title: Send conversation reply
        description: Send only text explicitly approved by the user for this exact conversation. Echo lastInboundAt and lastMessageAt from inspection, and use a stable idempotency key. Inspect delivery afterward.
        annotations:
          { readOnlyHint: false, destructiveHint: true, idempotentHint: true, openWorldHint: true }
      x-dmfaster-cli:
        section: Inbox
        usage: conversation reply --input FILE
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConversationReplyInput" }
      responses:
        "200":
          description: Reply action receipt, possibly queued or delivery unknown.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConversationReplyResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalServerError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/v1/agent/tools/conversation.reply.inspect:
    post:
      tags: [Agent tools]
      operationId: conversationReplyInspect
      summary: Inspect actual reply delivery state
      description: Reads the durable action created by conversation.reply, including queued, sent, failed, or delivery unknown state.
      x-dmfaster-effect: read
      x-dmfaster-required-scopes: ["inbox:read"]
      x-dmfaster-approval: none
      x-dmfaster-owner-only: false
      x-dmfaster-mcp:
        name: conversation_reply_inspect
        title: Inspect reply delivery
        description: Check the durable state of a reply by its idempotency key; queued is not sent.
        annotations:
          { readOnlyHint: true, destructiveHint: false, idempotentHint: true, openWorldHint: false }
      x-dmfaster-cli:
        section: Inbox
        usage: conversation reply inspect --input FILE
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConversationReplyInspectInput" }
      responses:
        "200":
