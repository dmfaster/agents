          enum: [not_connected, offline]
        setupUrl: { type: string, format: uri }
        message:
          type: string
          minLength: 1
          maxLength: 500
        userActionRequired: { type: boolean, const: true }
        campaignChannels:
          type: array
          uniqueItems: true
          items: { $ref: "#/components/schemas/TargetChannel" }
        resume: { $ref: "#/components/schemas/BrowserWorkerSetupResume" }

    CampaignLaunchSetupRequiredOutput:
