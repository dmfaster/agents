            technologies: { type: array, items: { type: string } }
            advertising: { type: object, additionalProperties: true }
            exhibitions: { type: array, items: { type: object, additionalProperties: true } }
            publicFunding: { type: [object, "null"], additionalProperties: true }
            funding: { type: [object, "null"], additionalProperties: true }
            hiring: { type: [object, "null"], additionalProperties: true }
      description: Read the complete company profile shown in the app, including financials, technologies, advertising, funding, hiring and decision-makers wherever available. Missing data is unknown.
    CompanyInspectResult:
      allOf:
        - $ref: "#/components/schemas/AgentToolResultBase"
        - type: object
          properties:
            tool:
              type: string
              const: company.inspect
            data:
              oneOf:
                - $ref: "#/components/schemas/CompanyInspectData"
                - type: "null"
