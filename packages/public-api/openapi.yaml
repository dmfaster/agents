      x-dmfaster-approval: none
      x-dmfaster-owner-only: false
      x-dmfaster-mcp:
        name: campaign_validate
        title: Validate campaign plan
        description: Validate a complete structured campaign state against DM Faster capabilities and domain rules without changing workspace data.
        annotations:
          readOnlyHint: true
          destructiveHint: false
          idempotentHint: true
          openWorldHint: false
      x-dmfaster-cli:
        section: Campaign planning and drafts
        usage: campaign validate --state FILE
      requestBody:
        required: true
        content:
