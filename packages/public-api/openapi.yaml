      additionalProperties: false
      required: [status, authorization, approvalUrl]
      properties:
        status: { type: string, const: approval_required }
        authorization: { $ref: "#/components/schemas/AgentActionAuthorization" }
        approvalUrl: { type: string, format: uri }

    BrowserWorkerSetupResume:
