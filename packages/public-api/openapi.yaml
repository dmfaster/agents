            - queued
            - running
            - completed
            - companiesPlanned
            - companiesReached
            - byChannel
          properties:
            queued:
              type: integer
              minimum: 0
            running:
              type: integer
              minimum: 0
            completed:
              type: integer
              minimum: 0
            companiesPlanned:
              type: integer
              minimum: 0
            companiesReached:
              type: integer
              minimum: 0
            byChannel:
              type: object
              additionalProperties: false
              required:
                - instagram
                - facebook
                - linkedin
                - gmail
                - sms
              properties:
                instagram:
                  type: integer
                  minimum: 0
                facebook:
                  type: integer
                  minimum: 0
                linkedin:
                  type: integer
                  minimum: 0
                gmail:
                  type: integer
                  minimum: 0
                sms:
                  type: integer
                  minimum: 0
        pipeline:
          $ref: "#/components/schemas/PipelineCounts"
        rates:
          type: object
          additionalProperties: false
          required:
            - replyOrFurtherPercent
            - bookedCallPercent
          properties:
            replyOrFurtherPercent:
              oneOf:
                - type: number
                  minimum: 0
                  maximum: 100
                - type: "null"
            bookedCallPercent:
              oneOf:
                - type: number
                  minimum: 0
                  maximum: 100
                - type: "null"
        settings:
          type: object
          additionalProperties: false
          properties:
            targetListId:
              type: string
            messageVariants:
              type: array
              items:
                type: string
            pacingSeconds:
              type: integer
            onlyNewChats:
