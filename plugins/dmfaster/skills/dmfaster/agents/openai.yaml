interface:
  display_name: "DM Faster"
  short_description: "Plan and operate DM Faster campaigns safely"
  default_prompt: "Use $dmfaster to inspect my workspace and carry out my requested campaign changes using the existing connection."

dependencies:
  tools:
    - type: "mcp"
      value: "dmfaster_hosted"
      description: "Official DM Faster hosted MCP server"
      transport: "streamable_http"
      url: "https://app.dmfaster.com/mcp"

policy:
  allow_implicit_invocation: true
